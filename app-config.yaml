app:
  title: Platform Lab
  baseUrl: https://backstage.local
  packages: all
  extensions:
    - page:catalog:
        config:
          path: /

organization:
  name: TourinhoM

backend:
  baseUrl: https://backstage.local
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    frame-src: ["'self'", 'https://grafana.local']
  cors:
    origin: https://backstage.local
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: pg
    connection:
      host: postgresql.infra.svc.cluster.local
      port: 5432
      user: backstage
      password: ${POSTGRES_PASSWORD}
      database: backstage

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

auth:
  environment: production
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true
    github:
      production:
        clientId: ${GITHUB_CLIENT_ID}
        clientSecret: ${GITHUB_CLIENT_SECRET}

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Group, User]
  providers:
    githubOrg:
      - id: tourinho-labs
        githubUrl: https://github.com
        orgs: [tourinho-labs]
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 3 }
    github:
      # Auto-discovery varre tourinho-labs e TourinhoM.
      tourinho-labs:
        organization: tourinho-labs
        catalogPath: /catalog-info.yaml
        filters:
          branch: main
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 3 }
      TourinhoM:
        organization: TourinhoM
        catalogPath: /catalog-info.yaml
        filters:
          branch: main
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 3 }
  locations:
    - type: file
      target: examples/entities.yaml
    - type: file
      target: examples/template/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: examples/org.yaml
      rules:
        - allow: [User, Group]

argocd:
  appLocatorMethods:
    - type: config
      instances:
        - name: homelab
          url: https://argocd.local
          token: ${ARGOCD_AUTH_TOKEN}

permission:
  enabled: true

proxy:
  endpoints:
    '/grafana/api':
      target: http://monitoring-grafana.monitoring.svc
      headers:
        Authorization: Bearer ${GRAFANA_TOKEN}

techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: homelab
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          # serviceAccountToken omitido → usa o token in-cluster montado no pod

grafana:
  domain: https://grafana.local
  unifiedAlerting: true
  token: ${GRAFANA_TOKEN}
